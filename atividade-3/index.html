<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Cadastro de Alunos</title>
  </head>
  <body>

      <h1>Cadastro de Alunos</h1>

      <form id="formulario">


        <label for="nome">Nome:</label>
        <input id="nome" name="nome" type="text" required />

        <label for="email">E-mail:</label>
        <input id="email" name="email" type="email" required />

        <label for="idade">Idade:</label>
        <input id="idade" name="idade" type="number" min="1" required />

        <label for="curso">Curso:</label>


         <select id="curso" name="curso" required>
           <option value="" selected disabled>Selecione um curso</option>
          <option value="Computação">Computação</option>
            <option value="Engenharia">Engenharia</option>
          <option value="Administração">Administração</option>
        </select>

       
        <button type="submit">Cadastrar</button>
      </form>

      <h2>Objeto JSON</h2>
      <pre id="json">Preencha o formulário para ver os dados.</pre>

      <h2>Alunos cadastrados</h2>
      <table>
        <thead>

          <tr><th>Nome</th><th>E-mail</th><th>Idade</th><th>Curso</th></tr>
        </thead>
        <tbody id="alunos"></tbody>
      </table>

 

    <script src="script.js"></script>
  </body>
</html>
